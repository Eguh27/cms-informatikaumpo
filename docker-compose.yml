services:
  web:
    image: node:22-bookworm-slim
    container_name: webprodi-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
    command: sh -c "npm install && npm run dev"

volumes:
  node_modules:
  next_cache:
